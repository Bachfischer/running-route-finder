# Require a week of registry age for newly resolved dependencies.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  sharp: true
  unrs-resolver: true
packageImportMethod: clone-or-copy
# Security floors for transitive dependencies; remove when upstream ranges resolve safely.
overrides:
  "ws@>=8.0.0 <8.21.0": 8.21.3
  "browserslist@<4.28.7": 4.28.9
  "@babel/core@>=7.0.0 <7.29.6": 7.29.7
  "baseline-browser-mapping@>=2.0.0 <2.11.0": 2.11.23
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
